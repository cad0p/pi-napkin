allowBuilds:
  esbuild: true
  "@google/genai": true
  protobufjs: false
  glimpseui: false
# own package: the || chain form only matched the first named version (0.10.0),
# so fresh releases kept tripping the 24h age check; bare name excludes all
minimumReleaseAgeExclude:
  - '@cad0p/napkin'
  - '@cad0p/pi-steering@0.2.0-20260812.0'
